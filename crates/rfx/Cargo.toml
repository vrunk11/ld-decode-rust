[package]
name = "rfx"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Reader of the lossless archives of several RF captures of one disc (.rfx)"

[lib]
name = "rfx"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
ld-decode = { path = "../ld-decode" }
rayon = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
claxon = "0.4"
